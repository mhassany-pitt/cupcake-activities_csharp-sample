include_choices: 4
question: |
  Given the following C# class definition:
  
  ```csharp
  public class BankAccount
  {
      public string Owner { get; set; }
      public int Balance { get; set; }
  
      public BankAccount(string owner, int balance)
      {
          Owner = owner;
          Balance = balance;
      }
  }
  ```
  
  Which of the following represents the correct implementation for a `Deposit` member method in C# that validates positive deposit amounts, modifies the `Balance` property, and returns the new balance?
choices:
  - body: |
      ```csharp
      public int Deposit(int amount)
      {
          if (amount > 0)
          {
              Balance += amount;
              return Balance;
          }
          throw new ArgumentException("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Validates that `amount > 0`.
          2. Mutates property state using `Balance += amount`.
          3. Returns the updated `int` balance.
          4. Correctly throws an `ArgumentException` when invalid non-positive amounts are supplied.
  - body: |
      ```csharp
      public int Deposit(int amount)
      {
          if (amount > 0)
          {
              int Balance = Balance + amount;
              return Balance;
          }
          return Balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Declaring `int Balance = ...` creates a local variable that shadows the `Balance` property, leaving the object property unmodified.
  - body: |
      ```csharp
      public int Deposit(int amount)
      {
          if (amount > 0)
          {
              Balance =+ amount;
              return Balance;
          }
          return Balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`Balance = +amount`), which overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```csharp
      public int Deposit(int amount)
      {
          if (amount > 0)
          {
              Balance += amount;
          }
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The method is declared with an `int` return type (`public int Deposit(...)`), but lacks a `return` statement, causing a C# compilation error: `not all code paths return a value`.

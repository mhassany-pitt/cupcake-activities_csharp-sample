$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parameterized-code-tracing/0.1.0
license: MIT
locale: en-US
id: parameterized_code_tracing_bank_account
source: Program.cs
title: Trace C# Bank Account State Transitions
description: Trace the sequence of balance updates and console outputs as starting balance, deposit amounts, and withdrawal amounts vary.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parameterized-code-tracing
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - classes
    - properties
    - methods
    - constructors
    - conditional-logic
    - state-tracing
    - arithmetic
runtime:
  language: csharp
  version: 10
statement: |
  Trace the execution of the C# program below and determine the exact console output produced.
  Pay close attention to:
  * How the initial balance is modified after `Deposit(...)`.
  * Whether the withdrawal amount exceeds the balance after deposit, triggering the `"Insufficient funds"` branch.
  * The final balance value output by `Console.WriteLine($"Balance: {account.Balance}")`.
testcases:
  - title: Standard Trace Execution
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    hints:
      - "Trace the parameter values step-by-step through each statement."
      - "Check if the withdrawal amount exceeds the balance to determine which branch executes."
    feedback:
      - on_pass:
          - explanations:
              - "Correct trace! You tracked the state transitions and outputs accurately."
        on_fail:
          - explanations:
              - "Your trace output did not match. Trace each parameter update carefully."
elements:
  - type: parameter
    location:
      context: var account = new BankAccount("Bob", 200);
      snippet: '200'
    values:
      - 100
      - 200
      - 300
  - type: parameter
    location:
      context: account.Deposit(100);
      snippet: '100'
    values:
      - 50
      - 100
      - 150
  - type: parameter
    location:
      context: account.Withdraw(50);
      snippet: '50'
    values:
      - 50
      - 200
      - 350

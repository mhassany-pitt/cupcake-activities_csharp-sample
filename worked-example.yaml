statement: |
  This worked example demonstrates how `BankAccount` state and operations are modeled in C# using object-oriented classes, auto-properties, and typed methods. We'll examine:
  1. The `BankAccount` class declaration and auto-implemented properties (`Owner` and `Balance`).
  2. The constructor initializing properties.
  3. The `Deposit` method with positive input validation and compound addition.
  4. The `Withdraw` method with compound guard logic protecting against overdrafts.
  5. The `Main` driver method in the `Program` class demonstrating object instantiation, method calls, and string interpolation.

  language: csharp
statement: |
  This worked example demonstrates how `BankAccount` state is managed in C# using classes and member methods. We'll examine:
  1. Class constructor (`BankAccount`)
  2. Deposit method (`Deposit`)
  3. Withdrawal method (`Withdraw`)
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: explanation
    location:
      snippet: "public BankAccount(string owner, int balance)"
    explanations:
      - body: |
          The constructor initializes properties in C#:
          ```csharp
          public BankAccount(string owner, int balance)
          {
              Owner = owner;
              Balance = balance;
          }
          ```
          This directly initializes `Owner` and `Balance` properties when the object is instantiated.
  - type: explanation
    location:
      snippet: "if (0 < amount && amount <= Balance)"
    explanations:
      - body: |
          This condition validates that the withdrawal transaction is correct: it checks if the `amount` is greater than `0` and is less than or equal to the current `Balance`.

$schema: https://learning-contents.org/schemas/code-completion/0.1.0
source: Program.cs
license: MIT
locale: en-US
id: cc_bank_account
title: Complete the BankAccount C# Implementation
description: Fill in essential C# keywords, operators, and method calls to declare classes, update properties, and validate transactions.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - classes
    - properties
    - arithmetic
    - relational-operators
    - methods
runtime:
  language: csharp
statement: |
  Complete the `BankAccount` class and method implementations in C# by selecting the correct keywords, operators, and method identifiers.
  Make sure to:
  1. Declare the object blueprint using the C# `class` keyword.
  2. Correctly increment `Balance` during a deposit.
  3. Ensure that withdrawal requests do not exceed the available balance.
  4. Invoke the proper transaction method in the `Main` driver method.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    stderr: ""
    status: pass
elements:
  - type: blank
    location:
      context: "public class BankAccount"
      snippet: "class"
      nth: 1
    choices:
      - snippet: "class"
        role: solution
        explanations:
          - body: |
              Correct! In C#, the `class` keyword defines a reference type containing data properties, constructors, and member methods.
      - snippet: "interface"
        role: distractor
        explanations:
          - body: |
              Incorrect. In C#, an `interface` defines contracts without auto-implemented property backing storage or constructor implementations.
      - snippet: "struct"
        role: distractor
        explanations:
          - body: |
              Incorrect. `struct` defines a value type in C#, whereas `BankAccount` is declared as a reference type class.
      - snippet: "record"
        role: distractor
        explanations:
          - body: |
              Incorrect. While `record` is a valid C# keyword, `class` is the canonical keyword matching this object blueprint.
  - type: blank
    location:
      context: "Balance += amount;"
      snippet: "+="
      nth: 1
    choices:
      - snippet: "+="
        role: solution
        explanations:
          - body: |
              Correct! The compound addition operator (`+=`) increases the `Balance` property by `amount`.
      - snippet: "-="
        role: distractor
        explanations:
          - body: |
              Incorrect. The compound subtraction operator (`-=`) would deduct money from the account during a deposit instead of crediting it.
      - snippet: "*="
        role: distractor
        explanations:
          - body: |
              Incorrect. The compound multiplication operator (`*=`) would multiply the existing balance by the deposit amount, corrupting the balance.
      - snippet: "="
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `=` overwrites the balance with `amount` rather than accumulating funds.
  - type: blank
    location:
      context: "if (0 < amount && amount <= Balance)"
      snippet: "<="
      nth: 1
    choices:
      - snippet: "<="
        role: solution
        explanations:
          - body: |
              Correct! The less-than-or-equal operator (`<=`) ensures the user has sufficient funds, allowing withdrawals up to and including the exact total balance without overdrafting.
      - snippet: "<"
        role: distractor
        explanations:
          - body: |
              Incorrect. The strictly-less-than operator (`<`) would prevent account holders from withdrawing their exact entire balance (withdrawing down to zero).
      - snippet: ">="
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>=` would invert the business logic, permitting withdrawals only when the amount is greater than or equal to the balance, guaranteeing an overdraft.
      - snippet: ">"
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>` would only permit transactions that exceed the current balance, causing an immediate overdraft into negative funds.
  - type: blank
    location:
      context: "account.Deposit(100);"
      snippet: "Deposit"
      nth: 1
    choices:
      - snippet: "Deposit"
        role: solution
        explanations:
          - body: |
              Correct! Invokes the `Deposit` method with an argument of `100` to credit the account.
      - snippet: "Withdraw"
        role: distractor
        explanations:
          - body: |
              Incorrect. Invoking `Withdraw(100)` would debit the account instead of performing the required deposit transaction.
      - snippet: "Balance"
        role: distractor
        explanations:
          - body: |
              Incorrect. `Balance` is an integer property, not a callable method; calling `account.Balance(100)` causes a C# compilation error.

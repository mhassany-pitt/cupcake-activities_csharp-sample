statement: |
  In the `Main` method of `Program`, write the C# code to interact with the `BankAccount` class:
  1. Instantiate a new `BankAccount` named `account` for owner `"Bob"` with an initial balance of `200`.
  2. Call `Deposit` with an amount of `100`.
  3. Call `Withdraw` with an amount of `50`.
  4. Print the final balance to the console using string interpolation: `Balance: {account.Balance}`.
